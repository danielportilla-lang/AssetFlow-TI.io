<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetFlow TI - Gestión de Activos</title>
  
  <!-- BOOTSTRAP 5 Y ESTILOS MODERNOS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem 1rem;
    }

    .container-custom {
      max-width: 1050px;
      margin: 0 auto;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 1.2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .kpi-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }

    .panel {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .badge-disponible {
      background-color: #dcfce7;
      color: #15803d;
      padding: 0.35em 0.8em;
      border-radius: 50px;
      font-weight: 600;
    }

    .badge-prestado {
      background-color: #fee2e2;
      color: #b91c1c;
      padding: 0.35em 0.8em;
      border-radius: 50px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container-custom">
    <!-- ENCABEZADO -->
    <header class="mb-4">
      <h1 class="fw-bold">AssetFlow TI</h1>
      <p class="text-muted">Sistema de Control y Trazabilidad de Préstamos de Equipos (Versión Cliente)</p>
    </header>

    <!-- TARJETAS DE MÉTRICAS (KPIs) -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="kpi-card">
          <div class="kpi-title">Total Equipos</div>
          <div class="kpi-value" id="kpiTotal">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card">
          <div class="kpi-title">Disponibles</div>
          <div class="kpi-value text-success" id="kpiDisponibles">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card">
          <div class="kpi-title">En Préstamo</div>
          <div class="kpi-value text-danger" id="kpiPrestados">0</div>
        </div>
      </div>
    </div>

    <!-- PANEL DE ACCIONES -->
    <div class="panel">
      <div class="row g-3 align-items-center">
        <div class="col-md-7">
          <form id="formEquipo" class="d-flex gap-2">
            <input type="text" id="nombreEquipo" class="form-control" placeholder="Ej: MacBook Pro 14 (Nombre del equipo)" required>
            <button type="submit" class="btn btn-primary fw-bold px-3">+ Agregar</button>
          </form>
        </div>
        <div class="col-md-5">
          <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar por equipo o empleado..." onkeyup="filtrarTabla()">
        </div>
      </div>
    </div>

    <!-- TABLA DE EQUIPOS -->
    <div class="table-container">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>EQUIPO</th>
            <th>ESTADO</th>
            <th>EMPLEADO ASIGNADO</th>
            <th>FECHA LÍMITE</th>
            <th>ACCIÓN</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>

  <!-- MODAL INTERACTIVO DE PRÉSTAMO -->
  <div class="modal fade" id="modalPrestar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Asignar Préstamo de Equipo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="modalEquipoId">
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">Nombre del Empleado:</label>
            <input type="text" id="modalEmpleado" class="form-control" placeholder="Ej: Juan Pérez" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">Fecha Límite de Devolución:</label>
            <input type="date" id="modalFechaLimite" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="confirmarPrestamo()">Confirmar Préstamo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP JS Y MOTOR LÓGICO EN JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // 1. BASE DE DATOS INICIAL EN MEMORIA/LOCALSTORAGE
    const equiposIniciales = [
      { id: 1, nombre: "Dell Latitude 5420", estado: "disponible", empleado: null, fecha_limite: null },
      { id: 2, nombre: "HP ProBook 440", estado: "prestado", empleado: "Juan Pérez", fecha_limite: "2026-10-15" }
    ];

    // Cargar datos almacenados o inicializar
    function obtenerEquipos() {
      const data = localStorage.getItem('assetflow_db');
      if (!data) {
        localStorage.setItem('assetflow_db', JSON.stringify(equiposIniciales));
        return equiposIniciales;
      }
      return JSON.parse(data);
    }

    function guardarEquipos(equipos) {
      localStorage.setItem('assetflow_db', JSON.stringify(equipos));
    }

    let bsModal;

    document.addEventListener("DOMContentLoaded", () => {
      bsModal = new bootstrap.Modal(document.getElementById('modalPrestar'));
      cargar();
    });

    // 2. RENDERIZADO DE TABLA Y KPIs
    function cargar() {
      const equipos = obtenerEquipos();
      renderizarTabla(equipos);
      actualizarKPIs(equipos);
    }

    function renderizarTabla(equipos) {
      const tabla = document.getElementById('tabla');
      
      if (equipos.length === 0) {
        tabla.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No hay equipos registrados.</td></tr>`;
        return;
      }

      tabla.innerHTML = equipos.map(e => `
        <tr>
          <td class="fw-bold">${e.nombre}</td>
          <td><span class="${e.estado === 'disponible' ? 'badge-disponible' : 'badge-prestado'}">${e.estado}</span></td>
          <td>${e.empleado || '<span class="text-muted">—</span>'}</td>
          <td>${e.fecha_limite ? new Date(e.fecha_limite).toLocaleDateString() : '<span class="text-muted">—</span>'}</td>
          <td>
            ${e.estado === 'disponible'
              ? `<button class="btn btn-sm btn-primary" onclick="abrirModal(${e.id})">Prestar</button>`
              : `<button class="btn btn-sm btn-outline-secondary" onclick="devolver(${e.id})">Devolver</button>`}
          </td>
        </tr>
      `).join('');
    }

    function actualizarKPIs(equipos) {
      const total = equipos.length;
      const prestados = equipos.filter(e => e.estado === 'prestado').length;
      const disponibles = total - prestados;

      document.getElementById('kpiTotal').innerText = total;
      document.getElementById('kpiDisponibles').innerText = disponibles;
      document.getElementById('kpiPrestados').innerText = prestados;
    }

    // 3. OPERACIONES DE INTERACCIÓN
    document.getElementById('formEquipo').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('nombreEquipo');
      const nombre = input.value.trim();
      if (!nombre) return;

      const equipos = obtenerEquipos();
      equipos.push({
        id: Date.now(),
        nombre: nombre,
        estado: 'disponible',
        empleado: null,
        fecha_limite: null
      });

      guardarEquipos(equipos);
      input.value = '';
      cargar();
    });

    function abrirModal(id) {
      document.getElementById('modalEquipoId').value = id;
      document.getElementById('modalEmpleado').value = '';
      document.getElementById('modalFechaLimite').value = '';
      bsModal.show();
    }

    function confirmarPrestamo() {
      const id = parseInt(document.getElementById('modalEquipoId').value);
      const empleado = document.getElementById('modalEmpleado').value.trim();
      const fecha_limite = document.getElementById('modalFechaLimite').value;

      if (!empleado || !fecha_limite) {
        alert('Por favor complete todos los campos.');
        return;
      }

      const equipos = obtenerEquipos();
      const eq = equipos.find(e => e.id === id);
      if (eq) {
        eq.estado = 'prestado';
        eq.empleado = empleado;
        eq.fecha_limite = fecha_limite;
        guardarEquipos(equipos);
      }

      bsModal.hide();
      cargar();
    }

    function devolver(id) {
      const equipos = obtenerEquipos();
      const eq = equipos.find(e => e.id === id);
      if (eq) {
        eq.estado = 'disponible';
        eq.empleado = null;
        eq.fecha_limite = null;
        guardarEquipos(equipos);
      }
      cargar();
    }

    function filtrarTabla() {
      const busqueda = document.getElementById('buscador').value.toLowerCase();
      const equipos = obtenerEquipos();
      const filtrados = equipos.filter(e => 
        e.nombre.toLowerCase().includes(busqueda) || 
        (e.empleado && e.empleado.toLowerCase().includes(busqueda))
      );
      renderizarTabla(filtrados);
    }
  </script>
</body>
</html>
